# Default scoring settings. These weights are hypotheses, not validated predictors.
# The dashboard lets you change them live; edit this file to change the defaults.

[categories]
financial_pressure = 35
commercial_opportunity = 45
growth_catalysts = 20

[financial_pressure]
reported_result = 40              # reported surplus/deficit, as a % of expenses
conference_relative_generated = 35
self_sufficiency = 25

[commercial_opportunity]
untapped_value = 40               # sponsorship & licensing revenue per football fan; less per fan = more room
fan_reach = 40                    # audience size: what national brands buy
regional_appeal = 20              # "only game in town", fan intensity, local sponsor pool
commercial_revenue = 0            # raw revenue size; off by default (it rewards the biggest programs twice)

[fan_reach]
football = 60
mens_basketball = 25
womens_basketball = 15

[regional_appeal]
only_game_in_town = 35            # fewer competing teams in the market
fan_intensity = 30                # football attendance relative to metro population
sponsor_pool = 35                 # sponsor-type businesses per competing team

[competition]
# How strongly each kind of team competes for the same sponsors, relative to an NFL team.
NFL = 1.0
MLB = 1.0
NBA = 1.0
NHL = 1.0
FBS_POWER4 = 1.0
MLS = 0.5
FBS_OTHER = 0.5
WNBA = 0.25
NWSL = 0.25

[catalysts]
# points per distinct event, before recency/confidence/relevance adjustments; total capped at 100
significance_high = 45
significance_medium = 25
significance_low = 10
recency_full_credit_months = 12   # events this recent count in full
recency_half_credit_months = 24   # then half credit up to here, quarter credit after
confidence_confirmed = 1.0
confidence_reported = 0.6
relevance_direct = 1.0            # directly about commercial/sponsorship revenue
relevance_indirect = 0.5

[rules]
scoring_fiscal_year = 2025
audience_season = "2024-25"
min_component_coverage = 0.60     # share of a category's weight that must have data
min_overall_coverage = 0.55       # share of total category weight needed for an overall score
min_peer_coverage = 0.50          # share of conference peers needed for a conference benchmark
peer_coverage_basis = "public_members"   # or "all_members": private schools don't publish NCAA reports
conference_comparison_basis = "own_operations"   # or "generated" (NCAA definition, includes conference payouts)
min_peer_count = 3                # fewer peers with data than this => no conference benchmark
no_benchmark_conferences = ["IND"]  # FBS independents aren't a conference
power4_conferences = ["B1G", "SEC", "BIG12", "ACC"]
rank_within = "segment"           # "segment" (Power 4 vs. Group of 5 & other FBS) or "all"
# A school in a smaller metro with no team from these leagues draws sponsors from its state, outside the
# metros that have one (Iowa: all of Iowa; Penn State: Pennsylvania outside Philadelphia and Pittsburgh)
statewide_market_max_population = 1000000
statewide_market_leagues = ["NFL", "MLB", "NBA", "NHL"]
